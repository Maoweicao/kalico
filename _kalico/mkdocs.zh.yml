# Secondary configuration for building the Simplified Chinese documentation.
# Output is published under /i18n/simple-chinese/ alongside the main English site.
# See cd-docs.yaml for how both sites are built and merged.

# Site and directory configuration
site_name: Kalico 文档
site_url: https://docs.kalico.gg/i18n/simple-chinese/
repo_url: https://github.com/KalicoCrew/kalico/
repo_name: KalicoCrew/kalico
edit_uri: edit/main/docs/i18n/simple-chinese/
use_directory_urls: False
docs_dir: '../i18n/simple-chinese/'
site_dir: '../../site/i18n/simple-chinese/'

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Custom markdown dialect settings
markdown_extensions:
  - toc:
      permalink: True
      toc_depth: 6
  - attr_list
  - md_in_html
  - mdx_partial_gfm
  - mdx_truly_sane_lists
  - mdx_breakless_lists
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: True
  - pymdownx.highlight:
      anchor_linenums: True
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  search:
    lang: zh
  mkdocs-simple-hooks:
    hooks:
      on_page_markdown: "mkdocs_hooks:transform"
  gh-admonitions:
  redirects:
    redirect_maps:
      'RT_Performance_Optimization_CN.md': 'RT_Performance_Optimization.md'
      'safety-monitoring_CN.md': 'safety-monitoring.md'
      'servo-safety_CN.md': 'servo-safety.md'
      'Handwheel_zh.md': 'Handwheel.md'

# Website layout configuration (using mkdocs-material theme)
theme:
  name: material
  logo: logo/kalico-96x96.png
  favicon: logo/kalico-32x32.png
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
    alternate: material/web
    logo: fontawesome/brands/bolt
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    top: material/arrow-up
    edit: material/pencil
    search: material/magnify
  features:
    - navigation.top # back to top button
    - navigation.instant # XHR loading instead of full page reload
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking # url automatically refers to the current paragraph
    - navigation.footer # render prev/next links in the footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - optimize # output optimization
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: yellow
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

extra_css:
  - _kalico/css/extra.css

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 简体中文
      link: /i18n/simple-chinese/
      lang: zh-Hans

