;
; kalico_mcu_lib/examples/esp32s3_uart/platformio.ini
;
; Minimal ESP32-S3 demonstration of kalico_mcu_lib: the firmware exposes a
; Klipper/Kalico wire-protocol UART (UART0, TX=GPIO43 RX=GPIO44 @ 250000 baud)
; so a host can handshake / identify / run commands.  No steppers are wired.
;
; Build/upload:
;   cd kalico_mcu_lib/examples/esp32s3_uart
;   pio run -e esp32s3
;   pio run -e esp32s3 -t upload
;   pio device monitor -b 250000
;

[env:esp32s3]
; Keep platform pinned to the locally-available release (PIO 6.1.x registry
; resolution of the unversioned "espressif32" platform can hang).
platform = espressif32@6.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 250000

build_flags =
    ; CLOCK_FREQ must match the 1MHz hardware timer tick (see src/esp32/timer.c)
    -DCONFIG_CLOCK_FREQ=1000000UL
    -DCONFIG_SERIAL_BAUD=250000
    ; Xtensa: keep literal pools out of the ISR flash-cache path
    -mtext-section-literals

; Scan the "other/" directory (which contains kalico_mcu_lib/) for libraries.
; LDF picks kalico_mcu_lib up because main.cpp includes <kalico_mcu.h>.
lib_extra_dirs = ${PROJECT_DIR}/../../..