# Kalico minimal test config for simavr + generic_arduino
# Connect klippy to the simavr-emulated ATmega2560 via PTY

[mcu]
serial: REPLACE_WITH_PTY_PATH
baud: 250000
restart_method: command

# No steppers, heaters, or endstops needed for protocol verification
# The MCU has stub handlers for all commands

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 100

[virtual_sdcard]
path: /tmp

[pause_resume]

[display_status]

# This is a minimal config for testing the klippy↔MCU protocol handshake.
# It uses virtual kinematics (no real motors) to verify:
#   1. identify handshake completes
#   2. Config CRC is sent and verified
#   3. MCU stays connected (no timeout/shutdown)
