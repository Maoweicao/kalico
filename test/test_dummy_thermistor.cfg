# Test configuration for dummy thermistor sensor

[mcu]
serial: /tmp/pseudoserial

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# Test dummy thermistor for extruder
[extruder]
nozzle_diameter: 0.4
filament_diameter: 1.75
sensor_type: dummy_thermistor
temperature: 200.0
min_extrude_temp: 0
step_pin: PC1
dir_pin: PC0
rotation_distance: 28.0

# Test dummy thermistor for heated bed
[heated_bed]
sensor_type: dummy_thermistor
temperature: 60.0
heater_pin: PD5

# Test dummy thermistor for temperature sensor
[temperature_sensor test_sensor]
sensor_type: dummy_thermistor
temperature: 25.0

[stepper_x]
step_pin: PA0
dir_pin: PA1
endstop_pin: PA2
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PB0
dir_pin: PB1
endstop_pin: PB2
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PC0
dir_pin: PC1
endstop_pin: PC2
position_endstop: 0
position_max: 200
