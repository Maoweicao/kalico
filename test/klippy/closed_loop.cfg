# Test config for the closed loop position controller

[stepper_x]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA3
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PA4
dir_pin: PA5
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA7
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PC0
dir_pin: PC1
enable_pin: !PC2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC3
position_endstop: 0.5
position_max: 200
homing_speed: 10

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[closed_loop]
enable: False
enable_correction: False
action: shutdown
pid_kp: 0.5
pid_ki: 0.0
pid_kd: 0.0
max_correction: 0.05
max_correction_rate: 2.0
max_reanchor_steps: 2
correction_interval: 0.020
error_threshold: 0.05
max_sample_age: 0.250
