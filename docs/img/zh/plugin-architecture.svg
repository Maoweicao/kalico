<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Arial, SimHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5CB85C"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F0AD4E"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Kalico 插件架构</text>

  <!-- printer.cfg -->
  <rect x="30" y="55" width="220" height="75" rx="8" fill="#FFF8E1" stroke="#F0AD4E" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A6D14">printer.cfg</text>
  <text x="140" y="96" text-anchor="middle" font-size="10" fill="#AA8520">[my_module]  定义配置段</text>
  <text x="140" y="112" text-anchor="middle" font-size="10" fill="#AA8520">[danger_options]  开关项</text>
  <text x="140" y="126" text-anchor="middle" font-size="10" fill="#AA8520">!!include  语法包含文件</text>

  <!-- ConfigWrapper -->
  <line x1="250" y1="92" x2="300" y2="92" stroke="#F0AD4E" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <rect x="305" y="55" width="180" height="75" rx="8" fill="#FFF8E1" stroke="#F0AD4E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="395" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A6D14">ConfigWrapper</text>
  <text x="395" y="96" text-anchor="middle" font-size="10" fill="#AA8520">config.get("name")</text>
  <text x="395" y="110" text-anchor="middle" font-size="10" fill="#AA8520">config.getfloat("value")</text>
  <text x="395" y="124" text-anchor="middle" font-size="10" fill="#AA8520">config.get_printer()</text>

  <!-- Plugin loads via config -->
  <line x1="395" y1="130" x2="395" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plugin module -->
  <rect x="260" y="180" width="270" height="120" rx="8" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B5C8D">插件 (your_module.py)</text>
  <text x="395" y="222" text-anchor="middle" font-size="10" fill="#4A90D9">def load_config(config) → 返回实例</text>
  <text x="395" y="238" text-anchor="middle" font-size="10" fill="#4A90D9">def load_config_prefix(config) → 返回实例</text>
  <text x="395" y="254" text-anchor="middle" font-size="10" fill="#4A90D9">def register_components(subsystem) → 可选</text>
  <text x="395" y="274" text-anchor="middle" font-size="10" fill="#666">printer.lookup_object("gcode")</text>
  <text x="395" y="290" text-anchor="middle" font-size="10" fill="#666">printer.register_event_handler(...)</text>

  <!-- Plugin → Printer -->
  <line x1="395" y1="300" x2="395" y2="340" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Printer Hub -->
  <rect x="130" y="345" width="530" height="200" rx="10" fill="#F5F7FA" stroke="#357ABD" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#357ABD">Printer (服务定位器 / 中央枢纽)</text>

  <!-- objects -->
  <rect x="150" y="390" width="155" height="65" rx="5" fill="#fff" stroke="#4A90D9" stroke-width="1" filter="url(#shadow)"/>
  <text x="227" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A90D9">.objects</text>
  <text x="227" y="424" text-anchor="middle" font-size="9" fill="#555">OrderedDict</text>
  <text x="227" y="440" text-anchor="middle" font-size="9" fill="#555">"toolhead"→head</text>
  <text x="227" y="452" text-anchor="middle" font-size="9" fill="#555">"gcode"→gcode</text>

  <!-- components -->
  <rect x="320" y="390" width="155" height="65" rx="5" fill="#fff" stroke="#4A90D9" stroke-width="1" filter="url(#shadow)"/>
  <text x="397" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A90D9">.components</text>
  <text x="397" y="424" text-anchor="middle" font-size="9" fill="#555">子系统集合</text>
  <text x="397" y="440" text-anchor="middle" font-size="9" fill="#555">"load_cell_sensors"</text>
  <text x="397" y="452" text-anchor="middle" font-size="9" fill="#555">→ {名称: 传感器}</text>

  <!-- event_handlers -->
  <rect x="490" y="390" width="155" height="65" rx="5" fill="#fff" stroke="#4A90D9" stroke-width="1" filter="url(#shadow)"/>
  <text x="567" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A90D9">.event_handlers</text>
  <text x="567" y="424" text-anchor="middle" font-size="9" fill="#555">Dict[str, List]</text>
  <text x="567" y="440" text-anchor="middle" font-size="9" fill="#555">"klippy:ready"</text>
  <text x="567" y="452" text-anchor="middle" font-size="9" fill="#555">→ [回调1, 回调2, ...]</text>

  <!-- Bottom: external services -->
  <text x="150" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#357ABD">GCode 调度器</text>
  <text x="150" y="506" text-anchor="middle" font-size="9" fill="#555">register_command()</text>
  <text x="150" y="520" text-anchor="middle" font-size="9" fill="#555">respond_info()</text>

  <text x="320" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#357ABD">Webhooks 客户端</text>
  <text x="320" y="506" text-anchor="middle" font-size="9" fill="#555">register_remote_method()</text>

  <text x="490" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#357ABD">Pins 引脚</text>
  <text x="490" y="506" text-anchor="middle" font-size="9" fill="#555">setup_pin("step", pin)</text>

  <text x="640" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#357ABD">MCU</text>
  <text x="640" y="506" text-anchor="middle" font-size="9" fill="#555">add_printer_objects()</text>

  <!-- Labels -->
  <text x="10" y="195" font-size="9" font-weight="bold" fill="#5CB85C">查找</text>
  <line x1="30" y1="200" x2="260" y2="220" stroke="#5CB85C" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

  <text x="10" y="340" font-size="9" font-weight="bold" fill="#5CB85C">注册事件</text>
  <line x1="100" y1="342" x2="140" y2="420" stroke="#5CB85C" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>

  <!-- Arrows from printer regs to services -->
  <line x1="227" y1="455" x2="150" y2="480" stroke="#999" stroke-width="1"/>
  <line x1="397" y1="455" x2="320" y2="480" stroke="#999" stroke-width="1"/>
  <line x1="567" y1="455" x2="490" y2="480" stroke="#999" stroke-width="1"/>
</svg>
