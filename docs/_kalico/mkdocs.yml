# Main configuration file for mkdocs generation of the Kalico documentation.

# Site and directory configuration
site_name: Kalico Documentation
site_url: https://docs.kalico.gg
repo_url: https://github.com/KalicoCrew/kalico/
repo_name: KalicoCrew/kalico
edit_uri: edit/main/docs/
use_directory_urls: False
docs_dir: '../'
site_dir: '../../site/'

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Custom markdown dialect settings
markdown_extensions:
  - toc:
      permalink: True
      toc_depth: 6
  - attr_list
  - md_in_html
  - mdx_partial_gfm
  - mdx_truly_sane_lists
  - mdx_breakless_lists
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: True
  - pymdownx.highlight:
      anchor_linenums: True
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  search:
    lang: en
  mkdocs-simple-hooks:
    hooks:
      on_page_markdown: "mkdocs_hooks:transform"
  gh-admonitions:
  redirects:
    redirect_maps:
      'Danger_Features.md': 'Kalico_Additions.md'
  exclude:
    glob:
      - 'i18n/**'

# Website layout configuration (using mkdocs-material theme)
theme:
  name: material
  logo: logo/kalico-96x96.png
  favicon: logo/kalico-32x32.png
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
    alternate: material/web
    logo: fontawesome/brands/bolt
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    top: fontawesome/solid/arrow-up
    edit: material/pencil
    search: material/magnify
  features:
    - navigation.top # back to top button
    - navigation.instant # XHR loading instead of full page reload
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking # url automatically refers to the current paragraph
    - navigation.footer # render prev/next links in the footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - optimize # output optimization
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: yellow
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - _kalico/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://kalico.gg/discord
      name: Join our Discord server!
  alternate:
    - name: English
      link: /
      lang: en
    - name: 简体中文
      link: /i18n/simple-chinese/
      lang: zh-Hans
  # Site usage statistics
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-site-analytics/#site-search-tracking
  analytics:
    provider: google
    property: G-3YZJ9658GV

