<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="phaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="100%" stop-color="#449D44"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Kalico Plugin Lifecycle</text>

  <!-- Phase 1: Discovery -->
  <rect x="170" y="50" width="300" height="90" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 1: Discovery 发现</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#e8f0fa">pkgutil.iter_modules("klippy.extras.")</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#e8f0fa">pkgutil.iter_modules("klippy.plugins.")</text>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="#cde">plugins 同名覆盖需 allow_plugin_override</text>

  <line x1="320" y1="140" x2="320" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Loading -->
  <rect x="170" y="175" width="300" height="80" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 2: Loading 加载</text>
  <text x="320" y="221" text-anchor="middle" font-size="11" fill="#e8f0fa">importlib.import_module() 逐模块导入</text>
  <text x="320" y="237" text-anchor="middle" font-size="11" fill="#e8f0fa">失败模块暂存异常，延迟报错</text>
  <text x="320" y="251" text-anchor="middle" font-size="10" fill="#cde">仅导入，不运行 load_config</text>

  <line x1="320" y1="255" x2="320" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Component Registration -->
  <rect x="170" y="290" width="300" height="70" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 3: Component Registration 组件注册</text>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#e8f0fa">调用 register_components(subsystem)</text>
  <text x="320" y="352" text-anchor="middle" font-size="10" fill="#cde">可选阶段，只有实现了该函数的模块会参与</text>

  <line x1="320" y1="360" x2="320" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 4: Initialization -->
  <rect x="140" y="395" width="360" height="120" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="421" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 4: Config Initialization 配置初始化</text>
  <text x="320" y="443" text-anchor="middle" font-size="11" fill="#e8f0fa">解析 printer.cfg → 遍历所有 section</text>
  <text x="320" y="461" text-anchor="middle" font-size="11" fill="#e8f0fa">→ load_object(config, section_name)</text>
  <text x="320" y="479" text-anchor="middle" font-size="11" fill="#e8f0fa">→ get_init_function(section) 选择入口</text>
  <text x="320" y="497" text-anchor="middle" font-size="11" fill="#e8f0fa">→ load_config(config) 或 load_config_prefix(config)</text>
  <text x="320" y="511" text-anchor="middle" font-size="10" fill="#cde">返回的实例存入 Printer.objects</text>

  <!-- Branch: exact vs prefix -->
  <rect x="148" y="520" width="170" height="40" rx="5" fill="url(#subGrad)" filter="url(#shadow)"/>
  <text x="233" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">[module_name]</text>
  <text x="233" y="554" text-anchor="middle" font-size="9" fill="#e0f0e0">→ load_config</text>

  <rect x="322" y="520" width="170" height="40" rx="5" fill="url(#subGrad)" filter="url(#shadow)"/>
  <text x="407" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">[module_name suffix]</text>
  <text x="407" y="554" text-anchor="middle" font-size="9" fill="#e0f0e0">→ load_config_prefix</text>

  <line x1="233" y1="515" x2="233" y2="520" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="407" y1="515" x2="407" y2="520" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Merge lines -->
  <line x1="233" y1="560" x2="320" y2="590" stroke="#333" stroke-width="1"/>
  <line x1="407" y1="560" x2="320" y2="590" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="590" x2="320" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 5: Connect -->
  <rect x="170" y="625" width="300" height="70" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="651" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 5: Connect 连接</text>
  <text x="320" y="671" text-anchor="middle" font-size="11" fill="#e8f0fa">klippy:mcu_identify 事件</text>
  <text x="320" y="687" text-anchor="middle" font-size="11" fill="#e8f0fa">klippy:connect 事件处理回调</text>

  <line x1="320" y1="695" x2="320" y2="725" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 6: Ready -->
  <rect x="170" y="730" width="300" height="70" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="756" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 6: Ready 就绪</text>
  <text x="320" y="776" text-anchor="middle" font-size="11" fill="#e8f0fa">klippy:ready 事件处理回调</text>
  <text x="320" y="792" text-anchor="middle" font-size="11" fill="#e8f0fa">开始处理 G-code 命令</text>

  <line x1="320" y1="800" x2="320" y2="830" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 7: Shutdown -->
  <rect x="170" y="835" width="300" height="55" rx="8" fill="url(#phaseGrad)" filter="url(#shadow)"/>
  <text x="320" y="858" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Phase 7: Shutdown / Restart</text>
  <text x="320" y="878" text-anchor="middle" font-size="11" fill="#e8f0fa">klippy:shutdown / klippy:disconnect → 重建 Printer</text>
</svg>
