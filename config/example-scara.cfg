# Example configuration for SCARA robot arm
#
# This demonstrates how to configure a SCARA (Selective Compliance
# Assembly Robot Arm) printer.

[mcu]
serial: /tmp/pseudoserial  # For simulation

[printer]
kinematics: scara
max_velocity: 100
max_accel: 500

# SCARA configuration
[scara]
linkage_1: 150       # Length of inner arm (mm)
linkage_2: 150       # Length of outer arm (mm)
offset_x: 100        # X offset of tower from bed center (mm)
offset_y: -56        # Y offset of tower from bed center (mm)
segments_per_second: 200
variant: morgan      # "morgan" or "mp"
print_radius: 250    # Maximum print radius (mm)
home_x: 100          # Home X position
home_y: 100          # Home Y position
home_z: 0            # Home Z position
max_z: 300           # Maximum Z height

# Shoulder motor (rotational)
[stepper_a]
step_pin: PA0
dir_pin: PA1
endstop_pin: PA2
rotation_distance: 360  # 360 degrees per full rotation
microsteps: 16

# Elbow motor (rotational)
[stepper_b]
step_pin: PB0
dir_pin: PB1
endstop_pin: PB2
rotation_distance: 360
microsteps: 16

# Z axis (linear)
[stepper_z]
step_pin: PC0
dir_pin: PC1
endstop_pin: PC2
position_endstop: 0
position_max: 300
microsteps: 16

# Extruder (optional)
[extruder]
nozzle_diameter: 0.4
filament_diameter: 1.75
sensor_type: EPCOS 100K B57560G104F
min_extrude_temp: 170
step_pin: PD0
dir_pin: PD1
rotation_distance: 28.0

# G-code commands for SCARA calibration
[gcode_macro SCARA_CALIBRATE]
description: Move SCARA to calibration positions
gcode:
  M117 SCARA Calibration
  M117 Moving to 0 degrees...
  G1 X250 Y0 Z50 F1000  # Move to 0 degrees
  M117 Moving to 90 degrees...
  G1 X0 Y250 Z50 F1000  # Move to 90 degrees
  M117 Moving to home...
  G1 X100 Y100 Z0 F1000  # Move to home
  M117 Calibration complete

[gcode_macro TEST_SCARA]
description: Test SCARA movement
gcode:
  M117 Testing SCARA movement
  G1 X150 Y150 Z50 F1000
  G1 X200 Y100 Z50 F1000
  G1 X100 Y200 Z50 F1000
  G1 X150 Y150 Z0 F1000
  M117 Test complete
