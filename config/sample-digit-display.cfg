# 数码管显示插件配置示例
#
# 此文件包含数码管显示插件的配置示例。
# 可以将这些配置片段复制到 printer.cfg 文件中使用。
#
# 支持的显示类型:
#   - 7seg: 传统7段数码管 (支持数字和有限字母)
#   - 14seg: 14段米字型数码管 (支持完整字母)
#   - 16seg: 16段数码管 (扩展字母支持)
#   - custom: 自定义段映射
#
# 支持的芯片驱动:
#   - hc595: 74HC595 移位寄存器
#   - tm1637: TM1637 两线串行驱动
#   - max7219: MAX7219 SPI驱动
#   - tm1640: TM1640 两线串行驱动
#   - tm1637_rgb: TM1637 带RGB背光
#   - max7219_rgb: MAX7219 带RGB背光

#==========================================================
# 示例 1: TM1637 4位7段数码管 (常见模块)
#==========================================================
# 硬件连接:
#   TM1637 CLK -> MCU PA0
#   TM1637 DIO -> MCU PA1
#   TM1637 VCC -> 3.3V 或 5V
#   TM1637 GND -> GND

#[digit_display my_display]
#chip: tm1637
#display_type: 7seg
#digits: 4
#clk_pin: PA0
#dio_pin: PA1
#brightness: 7
#scroll_direction: left
#scroll_speed: 0.5
#blink_rate: 0.5
#initial_text: "----"

#==========================================================
# 示例 2: MAX7219 8位7段数码管
#==========================================================
# 硬件连接:
#   MAX7219 DIN  -> MCU PA0
#   MAX7219 CS   -> MCU PA1
#   MAX7219 CLK  -> MCU PA2
#   MAX7219 VCC  -> 5V
#   MAX7219 GND  -> GND
#
# 注意: MAX7219 需要 5V 供电，但逻辑电平兼容 3.3V

#[digit_display max_display]
#chip: max7219
#display_type: 7seg
#digits: 8
#din_pin: PA0
#cs_pin: PA1
#clk_pin: PA2
#brightness: 7
#scroll_direction: bounce
#scroll_speed: 0.3

#==========================================================
# 示例 3: HC595 驱动的 4位7段数码管
#==========================================================
# 硬件连接:
#   74HC595 SER   (pin 14) -> MCU PA0 (DATA)
#   74HC595 SRCLK (pin 11) -> MCU PA1 (CLOCK)
#   74HC595 RCLK  (pin 12) -> MCU PA2 (LATCH)
#   74HC595 OE    (pin 13) -> GND
#   74HC595 SRCLR (pin 10) -> VCC
#
# 注意: 每个74HC595提供8位输出，4位数码管需要4字节数据

#[digit_display hc595_display]
#chip: hc595
#display_type: 7seg
#digits: 4
#data_pin: PA0
#clock_pin: PA1
#latch_pin: PA2
#brightness: 7

#==========================================================
# 示例 4: TM1637 14段米字型数码管
#==========================================================
# 14段米字型数码管支持完整字母表

#[digit_display alpha_display]
#chip: tm1637
#display_type: 14seg
#digits: 4
#clk_pin: PA0
#dio_pin: PA1
#brightness: 7
#scroll_direction: left
#scroll_speed: 0.4

#==========================================================
# 示例 5: MAX7219 16段数码管
#==========================================================
# 16段数码管提供最完整的字符支持

#[digit_display ext_display]
#chip: max7219
#display_type: 16seg
#digits: 8
#din_pin: PA0
#cs_pin: PA1
#clk_pin: PA2
#brightness: 10
#scroll_direction: bounce
#scroll_speed: 0.3

#==========================================================
# 示例 6: 自定义段映射
#==========================================================
# 使用自定义映射文件定义字符到段的映射

#[digit_display custom_display]
#chip: hc595
#display_type: custom
#digits: 4
#data_pin: PA0
#clock_pin: PA1
#latch_pin: PA2
#custom_map_file: ~/digit_map.cfg
#brightness: 7

#==========================================================
# 示例 7: 使用已配置的 HC595 芯片
#==========================================================
# 如果已经在 [hc595] 中配置了芯片，可以直接引用

#[hc595 my_shift]
#data_pin: PA0
#clock_pin: PA1
#latch_pin: PA2
#chain_count: 1

#[digit_display shared_hc595]
#chip: hc595
#display_type: 7seg
#digits: 4
#hc595_chip: my_shift
#brightness: 7

#==========================================================
# 示例 8: TM1637 RGB 4位7段数码管 (带RGB背光)
#==========================================================
# 硬件连接:
#   TM1637 CLK   -> MCU PA0
#   TM1637 DIO   -> MCU PA1
#   RGB LED 共阳 -> VCC
#   RGB LED R    -> MCU PA2 (通过限流电阻)
#   RGB LED G    -> MCU PA3 (通过限流电阻)
#   RGB LED B    -> MCU PA4 (通过限流电阻)
#   TM1637 VCC   -> 3.3V 或 5V
#   TM1637 GND   -> GND

#[digit_display rgb_display]
#chip: tm1637_rgb
#display_type: 7seg
#digits: 4
#clk_pin: PA0
#dio_pin: PA1
#red_pin: PA2
#green_pin: PA3
#blue_pin: PA4
#brightness: 7
#default_color: 255,0,0  # 默认红色
#scroll_direction: left
#scroll_speed: 0.5
#blink_rate: 0.5

#==========================================================
# 示例 9: MAX7219 RGB 8位14段米字型数码管
#==========================================================
# 硬件连接:
#   MAX7219 DIN  -> MCU PA0
#   MAX7219 CS   -> MCU PA1
#   MAX7219 CLK  -> MCU PA2
#   RGB LED R    -> MCU PA3 (通过限流电阻)
#   RGB LED G    -> MCU PA4 (通过限流电阻)
#   RGB LED B    -> MCU PA5 (通过限流电阻)
#   MAX7219 VCC  -> 5V
#   MAX7219 GND  -> GND

#[digit_display max_rgb_display]
#chip: max7219_rgb
#display_type: 14seg
#digits: 8
#din_pin: PA0
#cs_pin: PA1
#clk_pin: PA2
#red_pin: PA3
#green_pin: PA4
#blue_pin: PA5
#brightness: 10
#default_color: 0,255,0  # 默认绿色
#scroll_direction: bounce
#scroll_speed: 0.3

#==========================================================
# G-code 命令示例
#==========================================================
#
# 显示文本:
#   DIGIT_DISPLAY TEXT=1234
#   DIGIT_DISPLAY TEXT=HELLO
#   DIGIT_DISPLAY TEXT=25.6
#
# 清除显示:
#   DIGIT_CLEAR
#
# 配置滚动:
#   DIGIT_SCROLL DIRECTION=left SPEED=0.5
#   DIGIT_SCROLL DIRECTION=right SPEED=0.3
#   DIGIT_SCROLL DIRECTION=bounce SPEED=0.8
#
# 配置闪烁:
#   DIGIT_BLINK ENABLE=1 RATE=0.5
#   DIGIT_BLINK ENABLE=0
#
# 设置亮度:
#   DIGIT_BRIGHTNESS LEVEL=7
#   DIGIT_BRIGHTNESS LEVEL=15
#
# 查看状态:
#   DIGIT_STATUS
#
# RGB颜色控制 (仅限RGB驱动):
#   DIGIT_COLOR RED=255 GREEN=0 BLUE=0       # 红色
#   DIGIT_COLOR RED=0 GREEN=255 BLUE=0       # 绿色
#   DIGIT_COLOR RED=0 GREEN=0 BLUE=255       # 蓝色
#   DIGIT_COLOR RED=255 GREEN=255 BLUE=0     # 黄色
#   DIGIT_COLOR RED=255 GREEN=255 BLUE=255   # 白色
#   DIGIT_COLOR RED=255 GREEN=0 BLUE=0 DIGIT=0  # 仅第一位红色
#
# 颜色循环 (仅限RGB驱动):
#   DIGIT_COLOR_CYCLE ENABLE=1              # 启用彩虹效果
#   DIGIT_COLOR_CYCLE ENABLE=1 SPEED=2.0    # 2秒一个循环
#   DIGIT_COLOR_CYCLE ENABLE=0              # 禁用彩虹效果
#
#==========================================================
# 自定义映射文件格式 (digit_map.cfg)
#==========================================================
#
# # 每行一个字符映射，格式: <字符>: <十六进制值>
# # 以 # 开头的行为注释
#
# # 位数设置 (可选，默认为8)
# BITS: 8
#
# # 数字
# 0: 0x3F
# 1: 0x06
# 2: 0x5B
# 3: 0x4F
# 4: 0x66
# 5: 0x6D
# 6: 0x7D
# 7: 0x07
# 8: 0x7F
# 9: 0x6F
#
# # 字母
# A: 0x77
# B: 0x7C
# C: 0x39
# D: 0x5E
# E: 0x79
# F: 0x71
#
# # 符号
# -: 0x40
#  : 0x00
# .: 0x80
#
#==========================================================
# 7段数码管段定义参考
#==========================================================
#
#     A
#    ---
# F |   | B
#    -G-
# E |   | C
#    ---
#     D
#
# 段: A(上), B(右上), C(右下), D(下), E(左下), F(左上), G(中), DP(点)
#
# 7段支持的字符:
#   数字: 0-9
#   字母: A, b, C, d, E, F, H, L, o, P, U, y
#   符号: -, _, =, 空格, .
#
# 14段/16段支持完整字母表和更多符号。
