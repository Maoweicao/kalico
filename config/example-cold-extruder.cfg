# Example configuration for cold extruder (clay, concrete, etc.)
#
# This demonstrates how to configure an extruder that doesn't need
# heating, suitable for materials like clay, concrete, or other
# cold-extrusion materials.

[mcu]
serial: /tmp/pseudoserial  # For simulation

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 500
max_z_velocity: 10
max_z_accel: 100

# Cold extruder configuration for clay
[extruder]
nozzle_diameter: 1.5  # Large nozzle for clay
filament_diameter: 10.0  # Clay filament diameter
# Disable heater - this is a cold extruder
no_heater: true
# Use dummy thermistor for temperature monitoring (optional)
sensor_type: dummy_thermistor
temperature: 25.0  # Room temperature
# Extrusion settings for clay
max_extrude_cross_section: 50.0
max_extrude_only_distance: 100.0
max_extrude_only_velocity: 10
max_extrude_only_accel: 50
# Stepper configuration
step_pin: PC1
dir_pin: PC0
rotation_distance: 28.0  # Adjust for clay extrusion rate

# Second extruder (optional) - different nozzle size
[extruder1]
nozzle_diameter: 3.0  # Even larger nozzle
filament_diameter: 15.0
no_heater: true
sensor_type: dummy_thermistor
temperature: 25.0
max_extrude_cross_section: 100.0
max_extrude_only_distance: 150.0
max_extrude_only_velocity: 5
max_extrude_only_accel: 25
step_pin: PD1
dir_pin: PD0
rotation_distance: 35.0

# Bed configuration (no heating needed for clay)
[heated_bed]
sensor_type: dummy_thermistor
temperature: 25.0
heater_pin: PD5
# Disable bed heating
max_power: 0.0

# Temperature monitoring (optional)
[temperature_sensor environment]
sensor_type: dummy_thermistor
temperature: 25.0

# Stepper configuration
[stepper_x]
step_pin: PA0
dir_pin: PA1
endstop_pin: PA2
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PB0
dir_pin: PB1
endstop_pin: PB2
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PC0
dir_pin: PC1
endstop_pin: PC2
position_endstop: 0
position_max: 200

# G-code macros for clay extrusion
[gcode_macro EXTRUDE_CLAY]
description: Extrude clay at specified rate
gcode:
  {% set rate = params.RATE|default(5)|float %}
  {% set distance = params.DISTANCE|default(10)|float %}
  G91  # Relative positioning
  G1 E{distance} F{rate * 60}  # Extrude clay
  G90  # Absolute positioning

[gcode_macro RETRACT_CLAY]
description: Retract clay to prevent oozing
gcode:
  {% set distance = params.DISTANCE|default(5)|float %}
  G91  # Relative positioning
  G1 E-{distance} F300  # Retract
  G90  # Absolute positioning

[gcode_macro PURGE_CLAY]
description: Purge old clay from nozzle
gcode:
  {% set distance = params.DISTANCE|default(50)|float %}
  M117 Purging clay...
  G91  # Relative positioning
  G1 E{distance} F100  # Slow extrusion to purge
  G90  # Absolute positioning
  M117 Purge complete
