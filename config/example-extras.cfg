# The latest version of the config reference is also available online at:
#   https://www.klipper3d.org/Config_Reference.html

# LYX9231 closed-loop stepper driver (Modbus RTU configuration).
# See docs/LYX_Drivers.md and the "LYX stepper driver configuration"
# section of docs/Config_Reference.md for details.
#
# The STEP/DIR pins below come from the [stepper_x] section. The [lyx9231]
# section only configures the driver registers over a Modbus RTU bus that is
# bit-banged on the given uart_pin. The firmware must be built with the
# "Support software Modbus RTU UART communication" option enabled.
#[lyx9231 stepper_x]
#uart_pin: PB1
#uart_address: 1
#sense_resistor: 0.050
#microstep: 16
#run_current: 1.400
#hold_current: 0.700
#driver_motor_type: 1
#driver_op_mode: 2
#driver_boost_level: 1
