# Example configuration for dummy thermistor sensor
#
# This demonstrates how to use dummy thermistors for testing
# and development without physical sensors connected.

[mcu]
serial: /tmp/pseudoserial  # For simulation

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# Example: Using dummy thermistor for hotend
[extruder]
nozzle_diameter: 0.4
filament_diameter: 1.75
# Use dummy thermistor instead of real sensor
sensor_type: dummy_thermistor
temperature: 200.0  # Fixed temperature in Celsius
min_extrude_temp: 0  # Allow cold extrusion for testing
step_pin: PC1
dir_pin: PC0
rotation_distance: 28.0

# Example: Using dummy thermistor for heated bed
[heated_bed]
sensor_type: dummy_thermistor
temperature: 60.0  # Fixed temperature in Celsius
heater_pin: PD5

# Example: Using dummy thermistor for chamber temperature monitoring
[temperature_sensor chamber]
sensor_type: dummy_thermistor
temperature: 35.0  # Fixed chamber temperature
sensor_pin: PC3

# Example: Using dummy thermistor for MCU temperature
[temperature_sensor mcu_temp]
sensor_type: dummy_thermistor
temperature: 45.0  # Fixed MCU temperature

# Example: Dynamic temperature control via G-code
# You can change dummy sensor temperature at runtime:
# SET_DUMMY_TEMPERATURE SENSOR="chamber" TEMPERATURE=40.0
# SET_DUMMY_TEMPERATURE SENSOR="mcu_temp" TEMPERATURE=50.0

# Stepper configuration (minimal for testing)
[stepper_x]
step_pin: PA0
dir_pin: PA1
endstop_pin: PA2
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PB0
dir_pin: PB1
endstop_pin: PB2
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PC0
dir_pin: PC1
endstop_pin: PC2
position_endstop: 0
position_max: 200
