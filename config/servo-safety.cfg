######################################################################
# Option A: Integrated ALM pin support (recommended for simple setups)
######################################################################
# Add alm_pin directly to your servo stepper configuration.

# Example: CANopen stepper with ALM pin
#[canopen_stepper stepper_x]
#canopen_bus: mybus
#node_id: 1
#eds_file: ~/servo.eds
#canopen_mode: CSP
#rotation_distance: 360
#microsteps: 1
#endstop_pin: PB6
#
# ALM alarm pin configuration
#alm_pin: PB7                    # GPIO pin connected to servo ALM output
#alarm_action: shutdown          # Action on alarm: shutdown | pause | gcode | none
#alm_invert: false               # Invert pin logic (true for active-high ALM)

# Example: EtherCAT stepper with ALM pin
#[ethercat_stepper stepper_y]
#ethercat_interface: eth0
#ethercat_slave: 0
#ethercat_cycle_time: 0.001
#canopen_mode: CSP
#rotation_distance: 360
#microsteps: 1
#endstop_pin: PB6
#
#alm_pin: PB8
#alarm_action: shutdown
#alm_invert: false

# Example: RS485 stepper with ALM pin
#[rs485_stepper stepper_z]
#serial_port: /dev/ttyUSB0
#baud_rate: 9600
#rs485_protocol: modbus_rtu
#rs485_slave_id: 1
#rotation_distance: 360
#microsteps: 1
#endstop_pin: PB6
#
#alm_pin: PB9
#alarm_action: pause             # Pause print on alarm
#alm_invert: true                # Some drives use active-high ALM


######################################################################
# Option B: Independent servo alarm module (recommended for complex setups)
######################################################################
# Use [servo_alarm] for more flexible configuration.
# Can monitor any pin and apply to any stepper type.

#[servo_alarm x_axis_alarm]
#alm_pin: PB7
#action: shutdown                # shutdown | pause | gcode | none
#invert: false
#debounce: 0.01                  # Debounce time in seconds

#[servo_alarm y_axis_alarm]
#alm_pin: PB8
#action: gcode                   # Execute custom G-code on alarm
#invert: false
#debounce: 0.01
#alarm_gcode:
#  M118 ALARM: Y axis servo fault detected!
#  {action_emergency_stop("Y servo ALM triggered")}

#[servo_alarm z_axis_alarm]
#alm_pin: PB9
#action: pause                   # Pause print on alarm
#invert: true
#debounce: 0.02


######################################################################
# Option C: Custom alarm actions with G-code macros
######################################################################

#[gcode_macro ON_SERVO_ALARM]
#gcode:
#  {% set stepper = params.STEPPER|default("unknown") %}
#  M118 WARNING: Servo alarm on {stepper}!
#  # Turn off heaters
#  M104 S0
#  M140 S0
#  # Disable steppers
#  M84
#  # Emergency stop
#  {action_emergency_stop("Servo alarm on " ~ stepper)}

#[gcode_macro ALARM_REPORT]
#gcode:
#  QUERY_SERVO_ALARM
#  QUERY_SERVO


######################################################################
# G-code Commands Reference
######################################################################
#
# QUERY_SERVO [STEPPER=<name>]
#   Query servo drive status. Without STEPPER parameter, queries all servos.
#   Returns: state, mode, error_code, is_fault, alarm_active
#
# RESET_SERVO_FAULT STEPPER=<name>
#   Reset servo drive fault via CiA 402 fault reset command.
#
# QUERY_SERVO_ALARM
#   Query all [servo_alarm] module states.
#
# QUERY_ALARM_<name>
#   Query specific [servo_alarm] state (name is last part of section name).
#
# CLEAR_ALARM_<name>
#   Clear specific [servo_alarm] state.
#
# QUERY_SERVO_ALARM STEPPER=<name>
#   Query alarm state for specific stepper (when alm_pin is configured).
#
# RESET_SERVO_ALARM STEPPER=<name>
#   Reset alarm and fault for specific stepper.


######################################################################
# Status Fields Reference
######################################################################
#
# Servo stepper get_status() returns:
#   state:            CiA 402 state name (e.g., "OPERATION_ENABLED", "FAULT")
#   actual_position:  Current encoder position
#   error_code:       Drive error code (from 0x603F register)
#   mode:             Operating mode (CSP, CSV, PP, etc.)
#   is_fault:         Boolean, true if drive is in fault state
#   statusword:       Raw CiA 402 statusword (0x6041)
#   alarm_active:     Boolean, true if ALM pin is active
#   alarm_count:      Number of alarm events since startup
#
# ServoAlarm get_status() returns:
#   alarm_active:     Boolean, true if alarm is currently active
#   alarm_count:      Number of alarm triggers since startup
#   last_alarm_time:  Timestamp of last alarm event
#   pin:              Configured ALM pin
#   action:           Configured alarm action


######################################################################
# Hardware Wiring Notes
######################################################################
#
# Typical servo drive ALM output wiring:
#
#   Servo Drive                    MCU (e.g., STM32)
#   +---------+                    +------------+
#   | ALM OUT |---[10k pullup]---| GPIO (PBx) |
#   | GND     |-----------------| GND        |
#   +---------+                    +------------+
#
# Most servo drives have an open-collector ALM output:
#   - Normal: ALM pin is HIGH (pulled up)
#   - Alarm:  ALM pin is LOW (driven to GND)
#
# For active-high ALM outputs, set alm_invert: true
#
# Note: Some servo drives require 24V ALM output.
# Use a voltage divider or optocoupler for level shifting.
