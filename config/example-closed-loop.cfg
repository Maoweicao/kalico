# Example configuration for the Kalico closed loop position controller
#
# The [closed_loop] module compares the position reported by an [encoder]
# with the position the machine was commanded to be at at the same instant
# and corrects the paired stepper when the two disagree.
#
# Only the "cartesian" kinematics support position correction.  On other
# kinematics the module still reports the position error but it does not
# apply any correction.
#
# The encoder should be mounted on the load side of the axis (the moving
# carriage) for the measurement to be meaningful.  An encoder on the motor
# shaft faithfully follows the step pulses and will report an error of
# approximately zero.
#
# The "scale" option is the number of millimeters of axis travel per
# encoder revolution.  It defaults to the rotation_distance of the paired
# stepper which is correct for a 1:1 drive.  Set it explicitly when the
# encoder is mounted on the load side of a belt or gear reduction.

[closed_loop]
# Enable the controller at startup
enable: False
# Apply the position corrections (otherwise the error is only reported)
enable_correction: False
# What to do when the position error exceeds "error_threshold"
#action: shutdown
# PID gains - "pid_ki" has units of 1/second, "pid_kd" has units of seconds
#pid_kp: 0.5
#pid_ki: 0.0
#pid_kd: 0.0
# Maximum correction (mm) applied per update
#max_correction: 0.05
# Maximum total correction (mm/second) that may be applied
#max_correction_rate: 2.0
# Maximum number of steps a stepper reference may be re-anchored by.
# This is limited by the Klipper step compressor - do not raise it above 2
#max_reanchor_steps: 2
# Update interval of the controller (seconds)
#correction_interval: 0.020
# Position error (mm) that is reported and acted upon
#error_threshold: 0.05
# Maximum age (seconds) of an encoder sample that is still used
#max_sample_age: 0.250

# An AS5047D magnetic angle encoder on the X axis
[encoder my_x_encoder]
encoder_type: as5047d
# The SPI enable pin of the sensor
cs_pin: PC13
# The stepper this encoder is paired with
stepper: stepper_x
# The cartesian axis that the encoder measures
axis: x
# Millimeters of axis travel per encoder revolution.  The default is the
# rotation_distance of the paired stepper.
#scale: 40.0
# Invert the direction of the reported position
#invert: False
# The query period (seconds) used during measurements
#sample_period: 0.000400
