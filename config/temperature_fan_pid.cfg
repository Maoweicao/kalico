# MCU温度传感器 - 读取下位机MCU温度
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
# sensor_mcu: mcu  # 默认读取主MCU，如果有多个MCU可以指定
min_temp: 0
max_temp: 100
gcode_id: MCU

# Host温度传感器 - 读取上位机CPU温度（如树莓派）
[temperature_sensor host_temp]
sensor_type: temperature_host
# sensor_path: /sys/class/thermal/thermal_zone0/temp  # 默认路径
min_temp: 0
max_temp: 100
gcode_id: CPU

# MCU散热风扇 - PID控制
[temperature_fan mcu_fan]
pin: <你的MCU风扇引脚>  # 例如: PA5, PB0 等
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
off_below: 0.19

# 传感器设置
sensor_type: temperature_mcu
# sensor_mcu: mcu

# PID控制参数
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
pid_deriv_time: 2.0

# 温度控制范围
target_temp: 40.0
min_temp: 0
max_temp: 60

# 风扇速度限制（避免全速噪音）
max_speed: 0.8      # 最大转速80%，避免全速噪音
min_speed: 0.2      # 最小转速20%，保持最低散热

# Host散热风扇 - PID控制
[temperature_fan host_fan]
pin: <你的Host风扇引脚>  # 例如: host:gpio20 或其他引脚
max_power: 1.0
shutdown_speed: 1.0
kick_start_time: 0.5
off_below: 0.19

# 传感器设置
sensor_type: temperature_host
# sensor_path: /sys/class/thermal/thermal_zone0/temp

# PID控制参数
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
pid_deriv_time: 2.0

# 温度控制范围
target_temp: 50.0
min_temp: 0
max_temp: 80

# 风扇速度限制（避免全速噪音）
max_speed: 0.9      # 最大转速90%
min_speed: 0.1      # 最小转速10%

# 查询温度的宏
[gcode_macro QUERY_TEMPS]
gcode:
    {% set mcu_temp = printer["temperature_sensor mcu_temp"] %}
    {% set host_temp = printer["temperature_sensor host_temp"] %}
    {action_respond_info(
        "MCU Temperature: %.2f C\n"
        "Host Temperature: %.2f C" % (
            mcu_temp.temperature,
            host_temp.temperature))}

# 设置MCU风扇目标温度
[gcode_macro SET_MCU_FAN_TEMP]
gcode:
    {% set target = params.TARGET|default(40)|float %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=mcu_fan TARGET={target}

# 设置Host风扇目标温度
[gcode_macro SET_HOST_FAN_TEMP]
gcode:
    {% set target = params.TARGET|default(50)|float %}
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=host_fan TARGET={target}
