# Buzzer configuration example
#
# This plugin provides buzzer control for playing tones,
# built-in songs, and MIDI files.
#
# Installation:
#   For MIDI support, install mido: pip install mido
#
# Configuration:

[buzzer]
# Direct pin configuration (Option 1)
pin: PB5
volume: 0.5
# cycle_time: 0.001
# hardware_pwm: False

# OR reference an existing output_pin (Option 2)
# output_pin: beeper
# volume: 0.5

# GCode Commands:
#
# BUZZER_PLAY - Play a single tone
#   Parameters:
#     TONE=<frequency>  - Frequency in Hz (0-10000)
#     NOTE=<note_name>  - Note name (C4, A4, etc.)
#     DURATION=<ms>     - Duration in milliseconds
#   Examples:
#     BUZZER_PLAY TONE=1000 DURATION=500
#     BUZZER_PLAY NOTE=C4 DURATION=300
#     BUZZER_PLAY NOTE=A4 DURATION=500
#
# BUZZER_SONG - Play a built-in song
#   Parameters:
#     NAME=<song_name>  - Song name (see list below)
#   Examples:
#     BUZZER_SONG NAME=birthday
#     BUZZER_SONG NAME=complete
#
# BUZZER_MIDI - Play a MIDI file
#   Parameters:
#     FILE=<filepath>   - Path to MIDI file
#     CHANNEL=<channel> - MIDI channel (0-based, default 0)
#     SPEED=<factor>    - Speed factor (1.0 = normal)
#   Examples:
#     BUZZER_MIDI FILE=/tmp/song.mid
#     BUZZER_MIDI FILE=/tmp/song.mid CHANNEL=1
#     BUZZER_MIDI FILE=/tmp/song.mid SPEED=0.5
#
# BUZZER_STOP - Stop current playback
#
# BUZZER_LIST - List available songs or MIDI file info
#   Parameters:
#     FILE=<filepath>   - Show MIDI file info (optional)
#   Examples:
#     BUZZER_LIST
#     BUZZER_LIST FILE=/tmp/song.mid
#
# Built-in Songs:
#   Children's songs:
#     birthday      - Happy Birthday
#     star          - Twinkle Twinkle Little Star
#     tiger         - Two Tigers
#     ode_to_joy    - Ode to Joy
#     mary_lamb     - Mary Had a Little Lamb
#     jingle_bells  - Jingle Bells
#
#   Sound effects:
#     startup       - Startup sound
#     complete      - Print complete sound
#     error         - Error alert
#     warning       - Warning sound
#     notify        - Notification sound
#     alarm         - Alarm sound
#     click         - Click sound
#     beep          - Simple beep
#     double_beep   - Double beep
#
# Note Names:
#   C0-B8, CS0-BS8 (sharp), CF0-BF8 (flat)
#   Example: C4=262Hz, A4=440Hz, C5=523Hz
